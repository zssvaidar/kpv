name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the locally installed golangci-lint; the lint rules
  # themselves live once in .golangci.yml.
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  check:
    name: Lint, typecheck, test and build both toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node and pnpm versions come from .nvmrc and the packageManager field,
      # so CI and a developer read the same pins.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Go version comes from the go directive in agent/go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - run: pnpm install --frozen-lockfile

      # The same four root scripts a developer runs.
      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build
